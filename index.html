<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API-CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>API-CEP</h1>
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="">Nome</label>
            <input type="text">
            <br>
            <label for="">Sobrenome</label>
            <input type="text">
            <br>
            <label for="">RG</label>
            <input type="text">
            <br>
            <label for="">Data de nascimento</label>
            <input type="date">
            <br>
            <label for="">Estado Civil</label>
            <input type="text">
            <br>
            <label for="">CPF</label>
            <input type="number">
            <br>
            <label for="">Escolaridade</label>
            <input type="text">
            <br>
            <label for="">E-mail</label>
            <input type="text">
            <br>
            <label for="">Telefone</label>
            <input type="text">
            <br>
       

            <br><br>
            <legend>Endereço</legend>

    <label for="cep">CEP:</label>
    <input type="text" id="cep" name="cep" autocomplete="postal-code"
           maxlength="9" placeholder="00000-000">
    <br><br>

    <label for="rua">Rua:</label>
    <input type="text" id="rua" name="rua" readonly>
    <br><br>

    <label for="numero">Número:</label>
    <input type="number" id="numero" name="numero" min="1">
    <br><br>

    <label for="bairro">Bairro:</label>
    <input type="text" id="bairro" name="bairro" readonly>
    <br><br>

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" name="cidade" readonly>
    <br><br>

    <label for="estado">Estado:</label>
    <input type="text" id="estado" name="estado" readonly>
    <br><br>

    <label for="regiao">Região:</label>
    <input type="text" id="regiao" name="regiao" readonly>
    <br><br>

    <label for="ddd">DDD:</label>
    <input type="text" id="ddd" name="ddd" readonly>
    <br>
</body>
<script>
    //preencher os inputs com arrow functions
    const preencherFormulario = (endereco) => {
    document.getElementById("rua").value = endereco.logradouro;
    document.getElementById("bairro").value = endereco.bairro;
    document.getElementById("cidade").value = endereco.localidade;
    document.getElementById("estado").value = endereco.uf;
    document.getElementById("regiao").value = endereco.regiao;
    document.getElementById("ddd").value = endereco.ddd;
}
//autopreenchimento
const cepValido = (cep) => {
    if (cep.length == 8) {
        return true;
    } else {
        return false;
    }
}
//buscar API
const pesquisarCep = async () => {
    const cep = document.getElementById("cep").value;
    const url = `http://viacep.com.br/ws/${cep}/json/`;
    if (cepValido(cep)) {
        const dados = await fetch(url);
        const endereco = await dados.json();
            preencherFormulario(endereco);
        }
}
document.getElementById("cep").addEventListener("focusout", pesquisarCep);
</script>
</html>
